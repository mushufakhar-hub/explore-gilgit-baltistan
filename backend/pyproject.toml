[project]
name = "explore-gilgit-backend"
version = "0.1.0"
description = "Backend service for Explore Gilgit-Baltistan tourism platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "gunicorn>=22.0.0,<23.0.0",
    "sqlalchemy>=2.0.30,<3.0.0",
    "aiosqlite>=0.11.0,<1.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "alembic>=1.13.2,<2.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "pyjwt[crypto]>=2.8.0,<3.0.0",
    "redis>=5.0.0,<6.0.0",
    "celery>=5.4.0,<6.0.0",
    "httpx>=0.27.0,<1.0.0",
    "sentry-sdk>=2.10.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "supabase>=2.5.0,<3.0.0",
    "cloudinary>=1.41.0,<2.0.0",
    "openai>=1.40.0,<2.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "ruff>=0.5.0,<1.0.0",
    "black>=24.4.0,<25.0.0",
    "mypy>=1.10.0,<2.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
